'use strict';

const DB_NAME='NovelWorldDB';
const DB_STORE='kv';

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>`${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`;
const nowISO=()=>new Date().toISOString();
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const fmtDate=v=>{if(!v)return'';const d=new Date(v);return Number.isNaN(d.getTime())?v:d.toLocaleDateString('zh-CN',{year:'numeric',month:'short',day:'numeric'});};
const wordCount=t=>String(t||'').replace(/\s/g,'').length;

let currentItem=null;
let sheetState=null;
let mapTool='select';
let selectedMapItem=null;
let selectedMapId=null;
let graphPositions={};
let saveTimer;
let unlocked=false;

function blankProject(title='我的世界'){
  const modules={}; MODULES.forEach(m=>modules[m.key]=[]);
  return {id:uid(),title,subtitle:'私人创作空间',createdAt:nowISO(),updatedAt:nowISO(),modules,maps:[{id:uid(),name:'世界地图',theme:'grid',background:'',items:[]}],settings:{accent:'gradient'}};
}
function defaultState(){const p=blankProject();return{version:3,activeProjectId:p.id,projects:[p],settings:{pinHash:'',lastBackup:'',compact:false}};}
function activeProject(){return state.projects.find(p=>p.id===state.activeProjectId)||state.projects[0];}

function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>req.result.createObjectStore(DB_STORE);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
async function dbGet(key){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(DB_STORE,'readonly');const r=tx.objectStore(DB_STORE).get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function dbSet(key,val){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).put(val,key);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
function save(){clearTimeout(saveTimer);activeProject().updatedAt=nowISO();saveTimer=setTimeout(()=>dbSet(STATE_KEY,state).catch(console.error),180);}

async function init(){
  try{state=await dbGet(STATE_KEY)||defaultState();}catch(e){console.error(e);state=defaultState();}

  render();

}

function mapMenu(){const maps=activeProject().maps;showSheet('地图管理','可建立世界、区域、城市等多级地图',`<div class="list">${maps.map(m=>`<button class="card list-item" data-select-map="${m.id}"><span class="thumb">⌖</span><span class="list-main"><b>${esc(m.name)}</b><p>${m.items.length} 个地图元素</p></span><span class="chev">›</span></button>`).join('')}</div><button class="primary" style="width:100%;margin-top:12px" data-action="new-map">＋ 新建地图</button>`);}

function graphData(){const p=activeProject();const nodes=[];p.modules.characters.forEach(x=>nodes.push({id:'c-'+x.id,label:x.title,type:'角色',image:x.image}));p.modules.organizations.forEach(x=>nodes.push({id:'o-'+x.id,label:x.title,type:'组织',image:x.image}));const byName=new Map(nodes.map(n=>[n.label,n.id]));const edges=[];p.modules.relationships.forEach(r=>{let s=byName.get(r.source),t=byName.get(r.target);if(!s){s='x-'+r.source;nodes.push({id:s,label:r.source||'未命名',type:'关联对象'});byName.set(r.source,s)}if(!t){t='x-'+r.target;nodes.push({id:t,label:r.target||'未命名',type:'关联对象'});byName.set(r.target,t)}edges.push({s,t,label:r.relation||'关系'});});p.modules.bonds.forEach(r=>{const parts=String(r.parties||'').split(/[、,，/&与]/).map(x=>x.trim()).filter(Boolean);if(parts.length>=2){let s=byName.get(parts[0]),t=byName.get(parts[1]);[0,1].forEach(i=>{if(!byName.get(parts[i])){const id='x-'+parts[i];nodes.push({id,label:parts[i],type:'关联对象'});byName.set(parts[i],id);}});s=byName.get(parts[0]);t=byName.get(parts[1]);edges.push({s,t,label:r.kind||'羁绊'});}});return{nodes:[...new Map(nodes.map(n=>[n.id,n])).values()],edges};}
function renderGraph(){const {nodes,edges}=graphData();const w=1000,h=700;nodes.forEach((n,i)=>{if(!graphPositions[n.id]){const a=(Math.PI*2*i/Math.max(nodes.length,1))-Math.PI/2;graphPositions[n.id]={x:500+300*Math.cos(a),y:350+230*Math.sin(a)};}});return`<div class="page"><div class="page-title"><button class="back-btn" data-route="visual">‹</button><div><h1>⌬ 关系图谱</h1><p>${nodes.length} 个节点 · ${edges.length} 条关系</p></div><button class="tiny-btn" data-open-module="relationships">编辑关系</button></div><div class="graph-tools"><button class="tool-chip" data-action="graph-reset">自动排布</button><button class="tool-chip" data-open-module="characters">角色库</button><button class="tool-chip" data-open-module="organizations">组织</button></div>${nodes.length?`<div class="canvas-wrap"><div class="graph-canvas" id="graphCanvas"><svg class="graph-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${edges.map(e=>{const a=graphPositions[e.s],b=graphPositions[e.t];if(!a||!b)return'';const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;return`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#b9afd7" stroke-width="2"/><text class="edge-label" x="${mx}" y="${my-6}" text-anchor="middle">${esc(e.label)}</text>`}).join('')}</svg>${nodes.map(n=>{const p=graphPositions[n.id];return`<div class="graph-node" data-graph-node="${n.id}" style="left:${p.x/10}%;top:${p.y/7}%">${n.image?`<img src="${n.image}" alt="">`:'<span>'+ (n.type==='组织'?'⌂':'♙') +'</span>'}<b>${esc(n.label)}</b><small>${esc(n.type)}</small></div>`}).join('')}</div></div>`:`<div class="card empty"><div class="empty-icon">⌬</div><h3>图谱还没有节点</h3><p>先创建角色或组织，再在“关系”中填写起点和终点，图谱会自动生成。</p><button class="primary" data-open-module="characters">新建角色</button></div>`}</div>`;}
function bindGraph(){const canvas=$('#graphCanvas');if(!canvas)return;canvas.addEventListener('pointerdown',e=>{const node=e.target.closest('[data-graph-node]');if(!node)return;e.preventDefault();const id=node.dataset.graphNode;const move=ev=>{const r=canvas.getBoundingClientRect();const x=Math.max(4,Math.min(96,(ev.clientX-r.left)/r.width*100));const y=Math.max(6,Math.min(94,(ev.clientY-r.top)/r.height*100));node.style.left=x+'%';node.style.top=y+'%';graphPositions[id]={x:x*10,y:y*7};};const up=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);render();};window.addEventListener('pointermove',move);window.addEventListener('pointerup',up,{once:true});});}

function renderCalendar(){const arr=activeProject().modules.calendar;const cal=arr[0];if(!cal)return`<div class="page"><div class="page-title"><button class="back-btn" data-route="visual">‹</button><div><h1>▦ 世界历法</h1><p>建立属于你的纪元、月份与节日</p></div></div>${renderEmpty(moduleMap.calendar)}</div>`;const months=parseMonths(cal.months);const first=months[0]||{name:'第一月',days:30};const week=Number(cal.weekLength)||7;const heads=['一','二','三','四','五','六','日'].slice(0,week);return`<div class="page"><div class="page-title"><button class="back-btn" data-route="visual">‹</button><div><h1>▦ ${esc(cal.title)}</h1><p>${esc(cal.era||'自定义纪元')} · ${months.length} 个月</p></div><button class="tiny-btn" data-action="edit-calendar">编辑</button></div><section class="card calendar-card"><div class="calendar-head"><h3>${esc(first.name)}</h3><span>${first.days} 天</span></div><div class="calendar-grid">${heads.map(x=>`<div class="cal-cell head">${x}</div>`).join('')}${Array.from({length:first.days},(_,i)=>`<div class="cal-cell ${i===0?'today':''} ${hasHoliday(cal,1,i+1)?'event':''}">${i+1}</div>`).join('')}</div></section><div class="section-head"><h2>月份结构</h2></div><div class="list">${months.map((m,i)=>`<div class="card list-item"><span class="thumb">${i+1}</span><span class="list-main"><b>${esc(m.name)}</b><p>${m.days} 天</p></span></div>`).join('')}</div>${cal.holidays?`<div class="section-head"><h2>节日与纪念日</h2></div><section class="card detail-section"><div style="white-space:pre-wrap;font-size:13px;line-height:1.7">${esc(cal.holidays)}</div></section>`:''}</div>`;}
function parseMonths(v){return String(v||'').split('\n').map(x=>{const [name,days]=x.split(/[,，]/);return{name:(name||'').trim(),days:Number(days)||30}}).filter(x=>x.name);}
function hasHoliday(cal,m,d){return String(cal.holidays||'').split('\n').some(x=>x.trim().startsWith(`${m}-${d}`));}

function renderStats(){const p=activeProject();const items=allItems();const words=p.modules.manuscripts.reduce((n,x)=>n+wordCount(x.content),0);const filled=items.reduce((n,x)=>n+Object.values(x).filter(Boolean).length,0);const possible=items.reduce((n,x)=>n+(moduleMap[x._module]?.fields.length||0),0)||1;const pct=Math.min(100,Math.round(filled/possible*100));const top=MODULES.map(m=>({m,n:countFor(m.key)})).sort((a,b)=>b.n-a.n).slice(0,8);return`<div class="page"><div class="page-title"><button class="back-btn" data-route="library">‹</button><div><h1>▥ 创作统计</h1><p>仅根据本机数据计算</p></div></div><div class="audit-grid"><div class="card audit-card"><b>${items.length}</b><span>全部设定条目</span></div><div class="card audit-card"><b>${words.toLocaleString()}</b><span>正文字符</span></div><div class="card audit-card"><b>${p.modules.characters.length}</b><span>角色</span></div><div class="card audit-card"><b>${p.modules.plotLines.length}</b><span>剧情线</span></div></div><div class="section-head"><h2>档案填写度</h2><span>${pct}%</span></div><div class="progress"><i style="width:${pct}%"></i></div><div class="section-head"><h2>板块分布</h2></div><div class="list">${top.map(x=>`<button class="card list-item" data-open-module="${x.m.key}"><span class="thumb">${x.m.icon}</span><span class="list-main"><b>${x.m.name}</b><p>${x.n} 条内容</p><span class="progress" style="margin-top:7px"><i style="width:${Math.min(100,x.n*12)}%"></i></span></span><span class="chev">›</span></button>`).join('')}</div></div>`;}
function renderAudit(){const p=activeProject();const empties=MODULES.filter(m=>!m.special&&countFor(m.key)===0);const incomplete=[];allItems().forEach(x=>{const m=moduleMap[x._module];const missing=m.fields.filter(f=>f.required&&!x[f.key]).map(f=>f.label);if(missing.length)incomplete.push({x,m,missing});});const unnamed=allItems().filter(x=>!x.title);const due=p.modules.reminders.filter(x=>x.status!=='已完成'&&x.due&&new Date(x.due)<new Date());return`<div class="page"><div class="page-title"><button class="back-btn" data-route="library">‹</button><div><h1>✓ 补档案</h1><p>发现空白板块、必填缺失与过期提醒</p></div></div><div class="audit-grid"><div class="card audit-card"><b>${empties.length}</b><span>空白板块</span></div><div class="card audit-card"><b>${incomplete.length}</b><span>必填缺失</span></div><div class="card audit-card"><b>${unnamed.length}</b><span>未命名条目</span></div><div class="card audit-card"><b>${due.length}</b><span>过期提醒</span></div></div><div class="section-head"><h2>建议补充</h2></div><div class="list">${empties.slice(0,12).map(m=>`<button class="card list-item" data-open-module="${m.key}"><span class="thumb">${m.icon}</span><span class="list-main"><b>${m.name}</b><p>此板块仍为空：${m.desc}</p></span><span class="chev">›</span></button>`).join('')}${incomplete.slice(0,8).map(a=>`<button class="card list-item" data-item="${a.x.id}" data-module="${a.m.key}"><span class="thumb">!</span><span class="list-main"><b>${esc(a.x.title||'未命名')}</b><p>缺少：${esc(a.missing.join('、'))}</p></span><span class="chev">›</span></button>`).join('')||(!empties.length?'<div class="card empty"><div class="empty-icon">✓</div><h3>暂未发现明显缺口</h3><p>可以继续检查设定之间的逻辑一致性。</p></div>':'')}</div></div>`;}

</script>
  <script>
'use strict';

function renderSettings(){const p=activeProject();return`<div class="page"><div class="page-title"><div><h1>我的创作空间</h1><p>隐私、备份、作品管理与安装说明</p></div></div><section class="hero"><h1>${esc(p.title)}</h1><p>当前资料保存在 Safari / 主屏幕 App 的 IndexedDB 中，不会随网页代码提交到 GitHub。</p><div class="hero-row"><button class="primary" data-action="export">导出备份</button><button class="secondary" data-action="import">导入</button></div></section><div class="section-head"><h2>作品</h2></div><div class="card setting-list"><button class="setting-row" data-action="projects"><i>▤</i><div><b>切换或新建作品</b><small>${state.projects.length} 个本地作品</small></div><span class="chev">›</span></button><button class="setting-row" data-action="rename-project"><i>✎</i><div><b>修改作品名称</b><small>标题、说明与封面字</small></div><span class="chev">›</span></button></div><div class="section-head"><h2>隐私与安全</h2></div><div class="card setting-list"><button class="setting-row" data-action="pin"><i>⌾</i><div><b>${state.settings.pinHash?'修改 / 关闭应用锁':'设置应用锁'}</b><small>打开时需要输入本机 PIN</small></div><span class="chev">›</span></button><button class="setting-row" data-action="export-encrypted"><i>◇</i><div><b>导出加密备份</b><small>AES-GCM 加密后保存到文件</small></div><span class="chev">›</span></button><button class="setting-row" data-action="privacy-info"><i>◉</i><div><b>数据保存说明</b><small>了解 GitHub 网页与本机资料的区别</small></div><span class="chev">›</span></button></div><div class="section-head"><h2>使用</h2></div><div class="card setting-list"><button class="setting-row" data-action="install-help"><i>□</i><div><b>添加到 iPhone 主屏幕</b><small>像 App 一样全屏打开</small></div><span class="chev">›</span></button><button class="setting-row" data-action="clear-data"><i>⌫</i><div><b>清空当前作品</b><small>此操作不可撤销，请先导出</small></div><span class="chev">›</span></button></div></div>`;}

function newManuscript(item=null){if(!item){const rec={id:uid(),title:'未命名章节',chapter:'',content:'',createdAt:nowISO(),updatedAt:nowISO()};activeProject().modules.manuscripts.unshift(rec);save();currentItem=rec.id;}else currentItem=item.id;currentModule='manuscripts';route='editor';render();}
function renderEditor(id){const item=activeProject().modules.manuscripts.find(x=>x.id===id);if(!item){route='writing';return renderWritingHub();}return`<div class="page"><div class="page-title"><button class="back-btn" data-route="writing">‹</button><div><h1>正文编辑</h1><p>自动保存到本机</p></div><button class="tiny-btn" data-action="delete-manuscript">删除</button></div><div class="editor-shell"><div class="editor-meta"><input id="msTitle" value="${esc(item.title)}" placeholder="章节标题"><input id="msChapter" value="${esc(item.chapter||'')}" placeholder="章序"></div><textarea class="editor" id="msContent" placeholder="从一个画面、一句话或一个冲突开始……">${esc(item.content||'')}</textarea><div class="editor-foot"><span id="saveStatus">已保存</span><span id="wordStatus">${wordCount(item.content)} 字</span></div></div></div>`;}
function bindEditor(){const item=activeProject().modules.manuscripts.find(x=>x.id===currentItem);if(!item)return;let timer;const sync=()=>{item.title=$('#msTitle').value||'未命名章节';item.chapter=$('#msChapter').value;item.content=$('#msContent').value;item.updatedAt=nowISO();$('#wordStatus').textContent=wordCount(item.content)+' 字';$('#saveStatus').textContent='保存中…';clearTimeout(timer);timer=setTimeout(()=>{save();$('#saveStatus').textContent='已保存';},250);};['msTitle','msChapter','msContent'].forEach(id=>$(`#${id}`).addEventListener('input',sync));}

function renderLock(){document.querySelector('#app').innerHTML=`<div class="lock-screen"><div class="lock-card"><div class="lock-logo">世</div><h1>世界观工坊</h1><p style="color:var(--muted)">输入本机 PIN 解锁私人创作空间</p><input id="unlockPin" type="password" inputmode="numeric" maxlength="12" placeholder="••••"><button class="primary" id="unlockBtn">解锁</button></div></div>`;$('#unlockBtn').onclick=async()=>{const h=await hashText($('#unlockPin').value);if(h===state.settings.pinHash){unlocked=true;render();}else toast('PIN 不正确');};}
async function hashText(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}

</script>
  <script>
'use strict';

function bindInteractions(root=document){
 root.querySelectorAll('[data-route]').forEach(el=>el.onclick=()=>{route=el.dataset.route;currentItem=null;render();});
 root.querySelectorAll('[data-open-module]').forEach(el=>el.onclick=()=>openModule(el.dataset.openModule));
 root.querySelectorAll('[data-item]').forEach(el=>el.onclick=()=>{currentModule=el.dataset.module;currentItem=el.dataset.item;if(currentModule==='manuscripts'){newManuscript(activeProject().modules.manuscripts.find(x=>x.id===currentItem));}else{route='detail';render();}});
 root.querySelectorAll('[data-action]').forEach(el=>el.onclick=e=>handleAction(el.dataset.action,e));
 root.querySelectorAll('[data-map-tool]').forEach(el=>el.onclick=()=>{mapTool=el.dataset.mapTool;render();});
 root.querySelectorAll('[data-select-map]').forEach(el=>el.onclick=()=>{selectedMapId=el.dataset.selectMap;closeSheet();route='map';render();});
 const s=$('#moduleSearch',root);if(s)s.oninput=()=>{const q=s.value.trim().toLowerCase();const items=activeProject().modules[currentModule].filter(x=>JSON.stringify(x).toLowerCase().includes(q));$('#moduleList').innerHTML=items.length?`<div class="list">${items.map(x=>renderListItem({...x,_module:currentModule})).join('')}</div>`:renderEmpty(moduleMap[currentModule]);bindInteractions($('#moduleList'));};
}
function handleAction(a,e){
 const p=activeProject();
 if(a==='quick-add'){showQuickAdd();}
 else if(a==='projects')showProjects();
 else if(a==='search')showSearch();
 else if(a==='add-item')openForm(currentModule);
 else if(a==='edit-item')openForm(currentModule,p.modules[currentModule].find(x=>x.id===currentItem));
 else if(a==='save-form')saveForm();
 else if(a==='close-sheet')closeSheet();
 else if(a==='pick-image')pickImage(data=>{sheetState.image=data;$('.image-picker').innerHTML=`<img src="${data}" alt="已选择图片">`;});
 else if(a==='delete-item')confirmModal('删除档案','这条内容将从当前设备删除，无法撤销。',()=>{p.modules[currentModule]=p.modules[currentModule].filter(x=>x.id!==currentItem);save();route='module';currentItem=null;render();toast('已删除');},'删除');
 else if(a==='duplicate-item'){const old=p.modules[currentModule].find(x=>x.id===currentItem);const copy={...old,id:uid(),title:(old.title||'未命名')+' · 副本',createdAt:nowISO(),updatedAt:nowISO()};p.modules[currentModule].unshift(copy);save();currentItem=copy.id;render();toast('已复制');}
 else if(a==='new-manuscript')newManuscript();
 else if(a==='delete-manuscript')confirmModal('删除稿件','正文删除后无法恢复，请确认已经导出备份。',()=>{p.modules.manuscripts=p.modules.manuscripts.filter(x=>x.id!==currentItem);save();route='writing';render();},'删除稿件');
 else if(a==='map-upload')pickImage(data=>{currentMap().background=data;save();render();});
 else if(a==='map-delete-selected'){if(!selectedMapItem){toast('请先点选一个地图元素');return;}currentMap().items=currentMap().items.filter(x=>x.id!==selectedMapItem);selectedMapItem=null;save();render();}
 else if(a==='map-menu')mapMenu();
 else if(a==='new-map'){const name=prompt('地图名称','新区域地图');if(name){const m={id:uid(),name,theme:'grid',background:'',items:[]};p.maps.push(m);selectedMapId=m.id;save();closeSheet();render();}}
 else if(a==='map-help')showInfo('地图编辑说明','选择“城市、山脉、森林”等插件后，轻触地图即可插入。点选已有元素后可拖动；“底图”可从相册插入自制地图或参考图。所有坐标与图片只保存在本机。');
 else if(a==='graph-reset'){graphPositions={};render();}
 else if(a==='edit-calendar'){openForm('calendar',p.modules.calendar[0]);}
 else if(a==='export')exportBackup(false);
 else if(a==='export-encrypted')exportBackup(true);
 else if(a==='import')importBackup();
 else if(a==='install-help')showInstallHelp();
 else if(a==='privacy-info')showInfo('数据保存说明','GitHub 只保存这个工具的网页代码，不保存你填写的角色、剧情、地图和正文。创作数据保存在当前 iPhone / iPad 浏览器的 IndexedDB 中。清除 Safari 网站数据、换手机或删除主屏幕 App 都可能导致本机资料丢失，因此请定期导出加密备份到“文件”或 iCloud Drive。');
 else if(a==='rename-project')renameProject();
 else if(a==='pin')setPin();
 else if(a==='clear-data')confirmModal('清空当前作品','这会删除当前作品的全部设定、地图和正文。请先导出备份。',()=>{const fresh=blankProject(p.title);fresh.id=p.id;state.projects[state.projects.findIndex(x=>x.id===p.id)]=fresh;save();route='home';render();},'全部清空');
}

function showQuickAdd(){const keys=['characters','relationships','organizations','worldPlot','geography','items','plotLines','stories','manuscripts','reminders'];showSheet('快速新建','选择要创建的内容',`<div class="module-grid">${keys.map(k=>{const m=moduleMap[k];return`<button class="card module-card" data-quick-module="${k}"><span class="module-icon">${m.icon}</span><b>${m.name}</b><p>${m.desc}</p></button>`}).join('')}</div>`);$$('[data-quick-module]').forEach(b=>b.onclick=()=>{closeSheet();if(b.dataset.quickModule==='manuscripts')newManuscript();else{currentModule=b.dataset.quickModule;openForm(currentModule);}});}
function showProjects(){showSheet('作品空间','每个世界的数据相互独立',`<div class="list">${state.projects.map(p=>`<button class="card list-item" data-project-id="${p.id}"><span class="thumb">${esc((p.title||'世')[0])}</span><span class="list-main"><b>${esc(p.title)}</b><p>${esc(p.subtitle||'私人创作空间')} · ${fmtDate(p.updatedAt)}</p></span>${p.id===state.activeProjectId?'<i class="chip">当前</i>':'<span class="chev">›</span>'}</button>`).join('')}</div><button class="primary" style="width:100%;margin-top:12px" id="newProjectBtn">＋ 新建作品</button>`);$$('[data-project-id]').forEach(b=>b.onclick=()=>{state.activeProjectId=b.dataset.projectId;selectedMapId=null;save();closeSheet();route='home';render();});$('#newProjectBtn').onclick=()=>{const n=prompt('新作品名称','未命名世界');if(n){const p=blankProject(n);state.projects.push(p);state.activeProjectId=p.id;save();closeSheet();route='home';render();}};}
function showSearch(){showSheet('全局搜索','搜索角色、设定、剧情、正文和标签',`<div class="searchbar"><input id="globalSearch" autofocus placeholder="输入至少一个关键词"></div><div id="searchResults" class="list"></div>`);const input=$('#globalSearch');setTimeout(()=>input.focus(),50);input.oninput=()=>{const q=input.value.trim().toLowerCase();const rs=q?allItems().filter(x=>JSON.stringify(x).toLowerCase().includes(q)).slice(0,40):[];$('#searchResults').innerHTML=rs.length?rs.map(renderListItem).join(''):(q?'<div class="empty"><p>没有找到匹配内容</p></div>':'');bindInteractions($('#searchResults'));};}
function renameProject(){const p=activeProject();showSheet('修改作品信息','用于首页和主屏幕显示',`<div class="form-grid"><div class="field full"><label>作品名称</label><input id="projectName" value="${esc(p.title)}"></div><div class="field full"><label>副标题</label><input id="projectSub" value="${esc(p.subtitle||'')}"></div></div>`,`<button class="secondary" data-action="close-sheet">取消</button><button class="primary" id="saveProject">保存</button>`);$('#saveProject').onclick=()=>{p.title=$('#projectName').value.trim()||'未命名世界';p.subtitle=$('#projectSub').value.trim();save();closeSheet();render();};}
function setPin(){if(state.settings.pinHash){const choice=confirm('确定关闭应用锁吗？点击“取消”可改为新的 PIN。');if(choice){state.settings.pinHash='';save();render();toast('应用锁已关闭');return;}}const pin=prompt('设置 4–12 位 PIN（请牢记）','');if(!pin)return;if(!/^\d{4,12}$/.test(pin)){toast('请输入 4–12 位数字');return;}hashText(pin).then(h=>{state.settings.pinHash=h;unlocked=true;save();toast('应用锁已设置');});}

function pickImage(cb){const input=$('#filePicker');input.accept='image/*';input.onchange=()=>{const f=input.files[0];if(!f)return;if(f.size>8*1024*1024){toast('图片过大，请选择 8MB 以下图片');return;}const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(f);input.value='';};input.click();}
function checkDueReminders(){const due=activeProject().modules.reminders.filter(r=>r.status!=='已完成'&&r.due&&new Date(r.due)<=new Date());if(due.length)toast(`有 ${due.length} 条提醒已到期`);}

async function exportBackup(encrypted){try{const data=JSON.stringify({format:'NovelWorldBackup',version:3,exportedAt:nowISO(),state});let content=data,name=`世界观工坊-${safeName(activeProject().title)}-${new Date().toISOString().slice(0,10)}.json`;if(encrypted){const pwd=prompt('设置备份密码（导入时必须使用）','');if(!pwd)return;content=JSON.stringify(await encryptText(data,pwd));name=name.replace('.json','.nwbackup');}downloadText(content,name);state.settings.lastBackup=nowISO();save();toast(encrypted?'加密备份已导出':'备份已导出');}catch(e){console.error(e);toast('导出失败');}}
function importBackup(){const input=$('#filePicker');input.accept='.json,.nwbackup,application/json';input.onchange=async()=>{try{const text=await input.files[0].text();let obj=JSON.parse(text);if(obj.salt&&obj.iv&&obj.data){const pwd=prompt('输入备份密码','');if(!pwd)return;obj=JSON.parse(await decryptText(obj,pwd));}if(obj.format!=='NovelWorldBackup'||!obj.state)throw new Error('格式错误');confirmModal('导入备份','导入将覆盖当前所有本机作品与设置。',()=>{state=obj.state;normalizeState();dbSet(STATE_KEY,state);selectedMapId=null;route='home';render();toast('备份已导入');},'覆盖导入');}catch(e){console.error(e);toast('无法读取备份，可能密码或文件不正确');}finally{input.value='';}};input.click();}
function safeName(v){return String(v||'作品').replace(/[\\/:*?"<>|]/g,'-').slice(0,40);}
function downloadText(text,name){const blob=new Blob([text],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function b64(buf){return btoa(String.fromCharCode(...new Uint8Array(buf)));}function unb64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
async function deriveKey(password,salt){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:180000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function encryptText(text,password){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await deriveKey(password,salt),data=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(text));return{format:'NovelWorldEncryptedBackup',salt:b64(salt),iv:b64(iv),data:b64(data)};}
async function decryptText(obj,password){const salt=unb64(obj.salt),iv=unb64(obj.iv),key=await deriveKey(password,salt),data=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,unb64(obj.data));return new TextDecoder().decode(data);}

  <script>
'use strict';

/* Linked-world database layer: adds cross-module references without breaking old records. */
const NW_ALL_LINKABLE = MODULES.filter(m=>!['statistics','graphs','archiveAudit','mapCenter'].includes(m.key)).map(m=>m.key);
const NW_ENTITY_MODULES = ['characters','organizations','geography','items','nature','civilization','soulFaith','powerSystem','knowledge','economy','languages','worldPlot','plotLines','stories','manuscripts'];
const NW_LINK_RULES = {
  characters:{location:{modules:['geography'],multiple:true}},
  appearance:{owner:{modules:['characters','civilization','nature'],multiple:false}},
  relationships:{

  },

    character:{modules:['characters'],multiple:false,required:true},

  },

    scope:{modules:['geography','civilization','organizations'],multiple:true},

  },
  soulFaith:{clergy:{modules:['organizations','characters'],multiple:true}},
  knowledge:{
    tools:{modules:['items','nature'],multiple:true},
    masters:{modules:['characters','organizations','civilization'],multiple:true}
  },
  geography:{parent:{modules:['geography'],multiple:false}},
  items:{
    owner:{modules:['characters','organizations'],multiple:true},

    plot:{modules:['plotLines','worldPlot','stories','manuscripts'],multiple:true}

  bonds:{
    parties:{modules:['characters','organizations'],multiple:true,required:true,min:2},
    plot:{modules:['plotLines','worldPlot','manuscripts'],multiple:true}
  },
  plotLines:{
    characters:{modules:['characters'],multiple:true},
    clues:{modules:['items','stories','communications'],multiple:true},

  stories:{
    speaker:{modules:['characters'],multiple:false},
    timePlace:{modules:['geography','worldPlot'],multiple:true}
  },

    sender:{modules:['characters','organizations'],multiple:false},
    receiver:{modules:['characters','organizations'],multiple:true},
    channel:{modules:['items','languages'],multiple:true}
  },
  reminders:{linked:{modules:NW_ALL_LINKABLE,multiple:true}},
  languages:{users:{modules:['civilization','organizations','geography','characters'],multiple:true}}
};

const nwBaseBindInteractions = bindInteractions;
const nwBaseHandleAction = handleAction;
const nwBaseBindEditor = bindEditor;

function nwToken(module,id){return `${module}:${id}`;}
function nwParseToken(token){const i=String(token||'').indexOf(':');return i<1?null:{module:token.slice(0,i),id:token.slice(i+1)};}
function nwGetRecord(token){const p=nwParseToken(token);if(!p)return null;const item=activeProject().modules[p.module]?.find(x=>x.id===p.id);return item?{...p,item,moduleDef:moduleMap[p.module]}:null;}
function nwTitle(token){const r=nwGetRecord(token);return r?.item?.title||'已删除档案';}
function nwNormalizeRefs(v){return [...new Set((Array.isArray(v)?v:[]).map(String).filter(x=>nwParseToken(x)))];}
function nwRefs(item,key){return nwNormalizeRefs(item?._refs?.[key]);}
function nwRelated(item){return nwNormalizeRefs(item?._related);}
function nwRule(moduleKey,fieldKey){return NW_LINK_RULES[moduleKey]?.[fieldKey]||null;}
function nwItemsForModules(modules,excludeToken=''){
  const p=activeProject();
  return modules.flatMap(k=>(p.modules[k]||[]).map(item=>({token:nwToken(k,item.id),module:k,item})))
    .filter(x=>x.token!==excludeToken)
    .sort((a,b)=>String(a.item.title||'').localeCompare(String(b.item.title||''),'zh-CN'));
}
function nwRefText(tokens){return nwNormalizeRefs(tokens).map(nwTitle).filter(x=>x!=='已删除档案').join('、');}
function nwMakeRefChip(token,removable=false,field=''){
  const r=nwGetRecord(token);const label=r?.item?.title||'已删除档案';
  return `<button type="button" class="ref-chip ${r?'':'broken'}" ${removable?`data-remove-ref="${esc(token)}" data-ref-field="${esc(field)}"`:`data-linked-ref="${esc(token)}"`}><i>${esc(r?.moduleDef?.icon||'×')}</i><span>${esc(label)}</span><small>${esc(r?.moduleDef?.name||'失效')}</small>${removable?'<b>×</b>':''}</button>`;
}
function nwRenderRefControl(moduleKey,f,item){
  const rule=nwRule(moduleKey,f.key);const refs=nwRefs(item,f.key);const legacy=String(item?.[f.key]||'').trim();
  return `<div class="ref-control" data-ref-control="${esc(f.key)}">
    <div class="ref-chip-box" data-ref-chips="${esc(f.key)}">${refs.length?refs.map(t=>nwMakeRefChip(t,true,f.key)).join(''):'<span class="ref-empty">尚未选择档案</span>'}</div>
    <button type="button" class="ref-pick-btn" data-pick-ref="${esc(f.key)}">＋ 选择已有档案</button>
    ${legacy&&!refs.length?`<div class="legacy-ref">旧文字：${esc(legacy)}（保存时会保留）</div>`:''}
    <input type="hidden" name="${esc(f.key)}" value="${esc(legacy)}">
    ${rule?.required?'<small class="ref-hint">此项必须从已有档案中选择</small>':''}
  </div>`;
}
function nwRenderGeneralRelated(item){
  const refs=nwRelated(item);
  return `<div class="field full linked-field"><label>关联档案</label><div class="ref-control" data-ref-control="__related"><div class="ref-chip-box" data-ref-chips="__related">${refs.length?refs.map(t=>nwMakeRefChip(t,true,'__related')).join(''):'<span class="ref-empty">可关联人物、地点、组织、道具、剧情线、章节等</span>'}</div><button type="button" class="ref-pick-btn" data-pick-ref="__related">＋ 添加关联档案</button></div><small>关联后，对方档案会自动显示“被哪些内容引用”。</small></div>`;
}

openForm = function(key,item=null){
  const m=moduleMap[key];if(m.special==='writing'){newManuscript(item);return;}
  sheetState={type:'form',key,itemId:item?.id||null,image:item?.image||'',tags:parseTags(item?.tags),refs:JSON.parse(JSON.stringify(item?._refs||{})),related:nwRelated(item)};
  showSheet(item?`编辑${m.name}`:`新建${m.name}`,m.desc,renderForm(m,item),`<button class="secondary" data-action="close-sheet">取消</button><button class="primary" data-action="save-form">保存</button>`);
  bindFormExtras();
};
renderForm = function(m,item={}){
  return `<form id="itemForm" class="form-grid">${m.fields.map(f=>renderField(f,item?.[f.key],m.key,item)).join('')}${nwRenderGeneralRelated(item)}</form>`;
};
renderField = function(f,val='',moduleKey=currentModule,item={}){
  const full=['textarea','image','tags'].includes(f.type)||!!nwRule(moduleKey,f.key);const req=f.required?' *':'';let control='';
  if(nwRule(moduleKey,f.key))control=nwRenderRefControl(moduleKey,f,item);
  else if(f.type==='textarea')control=`<textarea name="${f.key}" placeholder="${esc(f.placeholder||'')}">${esc(val)}</textarea>`;
  else if(f.type==='select')control=`<select name="${f.key}"><option value="">请选择</option>${f.options.map(o=>`<option ${val===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  else if(f.type==='image')control=`<button type="button" class="image-picker" data-action="pick-image">${val?`<img src="${val}" alt="已选择图片">`:'<span>＋ 插入照片、角色立绘或参考图</span>'}</button>`;
  else if(f.type==='tags')control=`<div class="tag-input" id="tagBox">${parseTags(val).map(t=>`<span>${esc(t)} ×</span>`).join('')}<input id="tagEntry" placeholder="输入标签后回车"></div>`;
  else control=`<input name="${f.key}" type="${f.type||'text'}" value="${esc(val)}" placeholder="${esc(f.placeholder||'')}" ${f.min?`min="${f.min}"`:''} ${f.max?`max="${f.max}"`:''}>`;
  return `<div class="field ${full?'full':''}"><label>${esc(f.label)}${req}</label>${control}${f.hint?`<small>${esc(f.hint)}</small>`:''}</div>`;
};

bindFormExtras = function(){
  const tagEntry=$('#tagEntry');if(tagEntry){tagEntry.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const v=e.target.value.trim();if(v&&!sheetState.tags.includes(v)){sheetState.tags.push(v);e.target.value='';refreshTagBox();}}});const tagBox=$('#tagBox');if(tagBox)tagBox.addEventListener('click',e=>{if(e.target.tagName==='SPAN'){const text=e.target.textContent.replace(/\s*×\s*$/,'').trim();sheetState.tags=sheetState.tags.filter(t=>t!==text);refreshTagBox();}});}
  $$('[data-pick-ref]').forEach(b=>b.onclick=()=>nwOpenPicker(b.dataset.pickRef));
  $$('[data-remove-ref]').forEach(b=>b.onclick=()=>{const field=b.dataset.refField,token=b.dataset.removeRef;if(field==='__related')sheetState.related=nwNormalizeRefs(sheetState.related).filter(x=>x!==token);else sheetState.refs[field]=nwNormalizeRefs(sheetState.refs[field]).filter(x=>x!==token);nwRefreshRefControl(field);});
};
function nwRefreshRefControl(field){
  const box=$(`[data-ref-chips="${field}"]`);if(!box)return;const refs=field==='__related'?nwNormalizeRefs(sheetState.related):nwNormalizeRefs(sheetState.refs[field]);
  box.innerHTML=refs.length?refs.map(t=>nwMakeRefChip(t,true,field)).join(''):`<span class="ref-empty">${field==='__related'?'可关联人物、地点、组织、道具、剧情线、章节等':'尚未选择档案'}</span>`;
  bindFormExtras();
}
function nwOpenPicker(field){
  const moduleKey=sheetState.key;const rule=field==='__related'?{modules:NW_ALL_LINKABLE,multiple:true}:nwRule(moduleKey,field);if(!rule)return;
  const selected=new Set(field==='__related'?nwNormalizeRefs(sheetState.related):nwNormalizeRefs(sheetState.refs[field]));
  const exclude=sheetState.itemId?nwToken(moduleKey,sheetState.itemId):'';const choices=nwItemsForModules(rule.modules,exclude);
  const picker=document.createElement('div');picker.className='nested-picker';picker.innerHTML=`<div class="nested-backdrop"></div><section class="picker-card"><header><div><h3>${field==='__related'?'添加关联档案':'选择'+esc(moduleMap[moduleKey].fields.find(x=>x.key===field)?.label||'档案')}</h3><p>${rule.multiple?'可以选择多个':'只能选择一个'}</p></div><button type="button" class="close-btn" data-picker-close>×</button></header><div class="searchbar"><input data-picker-search placeholder="搜索名称、标签或板块"></div><div class="picker-groups" data-picker-list>${nwPickerChoices(choices,selected)}</div><footer><span data-picker-count>已选择 ${selected.size} 项</span><button type="button" class="primary" data-picker-done>完成</button></footer></section>`;
  $('#portal').appendChild(picker);
  const close=()=>picker.remove();picker.querySelector('[data-picker-close]').onclick=close;picker.querySelector('.nested-backdrop').onclick=close;
  const list=picker.querySelector('[data-picker-list]');
  const bindRows=()=>{list.querySelectorAll('[data-ref-choice]').forEach(row=>row.onclick=()=>{const t=row.dataset.refChoice;if(rule.multiple){selected.has(t)?selected.delete(t):selected.add(t);}else{selected.clear();selected.add(t);}row.closest('.picker-groups').innerHTML=nwPickerChoices(choices,selected);bindRows();picker.querySelector('[data-picker-count]').textContent=`已选择 ${selected.size} 项`;});};bindRows();
  picker.querySelector('[data-picker-search]').oninput=e=>{const q=e.target.value.trim().toLowerCase();const filtered=choices.filter(x=>(x.item.title+' '+(x.item.alias||'')+' '+(x.item.tags||'')+' '+moduleMap[x.module].name).toLowerCase().includes(q));list.innerHTML=nwPickerChoices(filtered,selected);bindRows();};
  picker.querySelector('[data-picker-done]').onclick=()=>{const arr=[...selected];if(field==='__related')sheetState.related=arr;else sheetState.refs[field]=arr;nwRefreshRefControl(field);close();};
}
function nwPickerChoices(choices,selected){
  if(!choices.length)return '<div class="picker-empty">没有可选择的档案，请先在相应板块创建内容。</div>';
  const grouped={};choices.forEach(x=>(grouped[x.module]||(grouped[x.module]=[])).push(x));
  return Object.entries(grouped).map(([module,items])=>`<section class="picker-group"><h4>${moduleMap[module].icon} ${moduleMap[module].name}<small>${items.length}</small></h4>${items.map(x=>`<button type="button" class="picker-row ${selected.has(x.token)?'selected':''}" data-ref-choice="${esc(x.token)}"><span>${x.item.image?`<img src="${x.item.image}" alt="">`:moduleMap[module].icon}</span><div><b>${esc(x.item.title||'未命名')}</b><small>${esc(x.item.alias||x.item.summary||moduleMap[module].desc)}</small></div><i>${selected.has(x.token)?'✓':'＋'}</i></button>`).join('')}</section>`).join('');
}

saveForm = function(){
  const {key,itemId}=sheetState;const m=moduleMap[key];const form=$('#itemForm');const data={};new FormData(form).forEach((v,k)=>data[k]=v);data.image=sheetState.image;data.tags=sheetState.tags;data._refs={};
  Object.entries(sheetState.refs||{}).forEach(([field,refs])=>{const clean=nwNormalizeRefs(refs);if(clean.length){data._refs[field]=clean;data[field]=nwRefText(clean);}});
  data._related=nwNormalizeRefs(sheetState.related);
  if(key==='relationships'){
    const a=nwTitle(data._refs.source?.[0]),b=nwTitle(data._refs.target?.[0]);data.source=a;data.target=b;
    if(!data.title||data.title==='未命名')data.title=`${a} · ${data.relation||'关系'} · ${b}`;
  }
  if(key==='bonds'&&data._refs.parties){data.parties=nwRefText(data._refs.parties);if(!data.title||data.title==='未命名')data.title=`${data.parties} · ${data.kind||'羁绊'}`;}
  const missing=m.fields.find(f=>{const rule=nwRule(key,f.key);if(rule?.required){const n=nwNormalizeRefs(data._refs[f.key]).length;return n<(rule.min||1);}return f.required&&!String(data[f.key]||'').trim();});
  if(missing){toast(`请填写或选择：${missing.label}`);return;}
  const arr=activeProject().modules[key];if(itemId){const old=arr.find(x=>x.id===itemId);Object.assign(old,data,{updatedAt:nowISO()});currentItem=itemId;}else{const rec={id:uid(),...data,createdAt:nowISO(),updatedAt:nowISO()};arr.unshift(rec);currentItem=rec.id;}
  save();closeSheet();route='detail';currentModule=key;render();toast('已保存，关联档案已同步');
};

function nwOutgoing(item){
  const groups=[];Object.entries(item?._refs||{}).forEach(([field,refs])=>{const clean=nwNormalizeRefs(refs);if(clean.length)groups.push({label:moduleMap[currentModule]?.fields.find(f=>f.key===field)?.label||field,refs:clean});});
  const related=nwRelated(item);if(related.length)groups.push({label:'关联档案',refs:related});return groups;
}
function nwBacklinks(moduleKey,id){
  const token=nwToken(moduleKey,id),out=[];
  MODULES.forEach(m=>(activeProject().modules[m.key]||[]).forEach(item=>{
    const fields=Object.entries(item._refs||{}).filter(([,refs])=>nwNormalizeRefs(refs).includes(token)).map(([k])=>m.fields.find(f=>f.key===k)?.label||k);
    if(nwRelated(item).includes(token))fields.push('关联档案');
    if(fields.length)out.push({module:m.key,item,fields});
  }));
  return out;
}
function nwRenderLinkSection(item){
  const outgoing=nwOutgoing(item),backs=nwBacklinks(currentModule,item.id);
  if(!outgoing.length&&!backs.length)return `<section class="card detail-section linked-section"><div class="section-title-line"><h3>关联网络</h3><button data-action="edit-item">＋ 添加关联</button></div><p class="ref-empty">还没有关联。编辑档案后，可以选择人物、组织、地点、道具、剧情线或稿件。</p></section>`;
  return `<section class="card detail-section linked-section"><h3>关联网络</h3>${outgoing.map(g=>`<div class="link-group"><b>${esc(g.label)}</b><div class="ref-chip-box">${g.refs.map(t=>nwMakeRefChip(t)).join('')}</div></div>`).join('')}${backs.length?`<div class="link-group backlinks"><b>被以下档案引用</b><div class="linked-list">${backs.map(x=>`<button data-linked-ref="${esc(nwToken(x.module,x.item.id))}"><i>${moduleMap[x.module].icon}</i><span><strong>${esc(x.item.title||'未命名')}</strong><small>${esc(moduleMap[x.module].name)} · ${esc(x.fields.join('、'))}</small></span><em>›</em></button>`).join('')}</div></div>`:''}</section>`;
}

renderDetail = function(key,id){

    const refs=nwRefs(item,f.key);const value=refs.length?`<div class="ref-chip-box">${refs.map(t=>nwMakeRefChip(t)).join('')}</div>`:`<div>${esc(item[f.key])}</div>`;
    return `<div class="detail-row"><span>${esc(f.label)}</span>${value}</div>`;

function nwRemoveTokenEverywhere(token){

graphData = function(){
  const p=activeProject(),nodes=[],edges=[],nodeMap=new Map();
  const ensure=token=>{if(!token)return null;if(nodeMap.has(token))return token;const r=nwGetRecord(token);if(!r)return null;const n={id:token,label:r.item.title||'未命名',type:r.moduleDef.name,image:r.item.image,module:r.module};nodes.push(n);nodeMap.set(token,n);return token;};
  ['characters','organizations','geography','items'].forEach(k=>(p.modules[k]||[]).forEach(x=>ensure(nwToken(k,x.id))));
  p.modules.relationships.forEach(r=>{let s=nwRefs(r,'source')[0],t=nwRefs(r,'target')[0];if(!s&&r.source)s=nwFindByTitle(r.source,NW_ENTITY_MODULES);if(!t&&r.target)t=nwFindByTitle(r.target,NW_ENTITY_MODULES);s=ensure(s);t=ensure(t);if(s&&t)edges.push({s,t,label:r.relation||'关系'});});
  p.modules.bonds.forEach(r=>{const parts=nwRefs(r,'parties');for(let i=1;i<parts.length;i++){const s=ensure(parts[0]),t=ensure(parts[i]);if(s&&t)edges.push({s,t,label:r.kind||'羁绊'});}});

const nwHandleAfter = handleAction;
handleAction = function(a,e){

  if(a==='save-manuscript-links'){const item=activeProject().modules.manuscripts.find(x=>x.id===sheetState.itemId);if(item){item._related=nwNormalizeRefs(sheetState.related);item.updatedAt=nowISO();save();closeSheet();render();toast('章节关联已保存');}return;}

function nwFindByTitle(text,modules=NW_ALL_LINKABLE){
  const q=String(text||'').trim().toLowerCase();if(!q)return'';
  for(const k of modules){for(const item of activeProject().modules[k]||[]){const names=[item.title,...String(item.alias||'').split(/[，,、/]/)].map(x=>String(x||'').trim().toLowerCase());if(names.includes(q))return nwToken(k,item.id);}}

}
function nwMigrateLinks(){
  let changed=false;state.version=Math.max(Number(state.version)||3,4);
  state.projects.forEach(project=>{
    const previous=state.activeProjectId;state.activeProjectId=project.id;
    Object.entries(NW_LINK_RULES).forEach(([moduleKey,fields])=>(project.modules[moduleKey]||[]).forEach(item=>{
      item._refs=item._refs||{};item._related=nwRelated(item);
      Object.entries(fields).forEach(([field,rule])=>{if(nwNormalizeRefs(item._refs[field]).length)return;const raw=String(item[field]||'').trim();if(!raw)return;const parts=rule.multiple?raw.split(/[、,，/&与\n]/).map(x=>x.trim()).filter(Boolean):[raw];const found=parts.map(x=>nwFindByTitle(x,rule.modules)).filter(Boolean);if(found.length){item._refs[field]=rule.multiple?found:[found[0]];changed=true;}});
    }));
    state.activeProjectId=previous;
  });
  return changed;
}

  <script>
'use strict';

/* NovelWorld visual rebuild: dashboard, relationship network and swimlane timeline. */
let nwGraphFilter='all';
let nwGraphFocus='';
let nwTimelineFilter='all';

function nwArray(v){return Array.isArray(v)?v:[];}
function nwSplitNames(v){return String(v||'').split(/[、,，/&与；;\n]/).map(x=>x.trim()).filter(Boolean);}
function nwFirstText(...vals){return vals.find(v=>String(v||'').trim())||'';}
function nwClamp(n,min,max){return Math.max(min,Math.min(max,n));}
function nwTone(label,source=''){
  const s=`${label||''} ${source||''}`;
  if(/恋人|朋友|亲属|家人|守护|师徒|盟友|依赖|恩情|承诺|挚友|爱/.test(s))return'emotion';
  if(/宿敌|仇敌|敌对|血仇|背叛|竞争|恶化|断裂|战争|冲突/.test(s))return'hostile';
  if(/羁绊|债务|共同秘密|误解|宿命/.test(s))return'bond';
  if(/持有|归属|领袖|成员|隶属|位于|常驻|出生/.test(s))return'link';
  return'neutral';
}
function nwKindIcon(kind){return({角色:'♙',组织:'⌂',道具:'◇',地点:'⌖',关联对象:'•'})[kind]||'•';}
function nwKindClass(kind){return({角色:'character',组织:'organization',道具:'item',地点:'place',关联对象:'other'})[kind]||'other';}

function nwGraphData(){
  const p=activeProject();
  const nodes=[];const edges=[];const nameMap=new Map();const nodeMap=new Map();
  const addNode=(id,label,kind,module='',itemId='',image='',aliases='')=>{
    label=String(label||'未命名').trim()||'未命名';
    if(nodeMap.has(id))return nodeMap.get(id);
    const n={id,label,kind,module,itemId,image:image||''};nodes.push(n);nodeMap.set(id,n);
    [label,...nwSplitNames(aliases)].forEach(name=>{const k=name.toLowerCase();if(k&&!nameMap.has(k))nameMap.set(k,id);});
    return n;
  };
  nwArray(p.modules.characters).forEach(x=>addNode(`characters:${x.id}`,x.title,'角色','characters',x.id,x.image,x.alias));
  nwArray(p.modules.organizations).forEach(x=>addNode(`organizations:${x.id}`,x.title,'组织','organizations',x.id,x.image,x.alias));
  nwArray(p.modules.items).forEach(x=>addNode(`items:${x.id}`,x.title,'道具','items',x.id,x.image));
  nwArray(p.modules.geography).forEach(x=>addNode(`geography:${x.id}`,x.title,'地点','geography',x.id,x.image));
  nwArray(p.maps).forEach(map=>nwArray(map.items).forEach(x=>{if(!x.label)return;const known=nameMap.get(String(x.label).trim().toLowerCase());if(!known)addNode(`map:${map.id}:${x.id}`,x.label,'地点','','','');}));
  const resolve=(name,kind='关联对象')=>{
    name=String(name||'').trim();if(!name)return'';
    const direct=nameMap.get(name.toLowerCase());if(direct)return direct;
    const id=`other:${name.toLowerCase().replace(/\s+/g,'-')}`;addNode(id,name,kind);return id;
  };
  const addEdge=(s,t,label,source,meta={})=>{
    if(!s||!t||s===t)return;
    const key=[s,t,label].join('|');if(edges.some(e=>e.key===key))return;
    edges.push({key,s,t,label:label||'关系',source,tone:nwTone(label,source),...meta});
  };
  nwArray(p.modules.relationships).forEach(r=>{
    const s=resolve(r.source),t=resolve(r.target);
    addEdge(s,t,r.relation||r.title||'关系','关系',{strength:Number(r.strength)||0,status:r.status||'',direction:r.direction||'双向',itemId:r.id,module:'relationships'});
  });
  nwArray(p.modules.bonds).forEach(r=>{
    const parts=nwSplitNames(r.parties);if(parts.length<2)return;
    const base=resolve(parts[0]);parts.slice(1).forEach(name=>addEdge(base,resolve(name),r.kind||r.title||'羁绊','羁绊',{itemId:r.id,module:'bonds'}));
  });
  nwArray(p.modules.items).forEach(x=>nwSplitNames(x.owner).forEach(owner=>addEdge(resolve(owner),`items:${x.id}`,'持有 / 归属','道具')));
  nwArray(p.modules.characters).forEach(x=>{
    nwSplitNames(x.location).slice(0,2).forEach(place=>addEdge(`characters:${x.id}`,resolve(place,'地点'),'常驻 / 出生','地点'));
  });
  nwArray(p.modules.organizations).forEach(x=>{
    nwSplitNames(x.leader).slice(0,3).forEach(name=>addEdge(resolve(name),`organizations:${x.id}`,'领袖 / 核心','组织'));
  });
  return{nodes,edges,nodeMap};
}

function nwGraphSubset(data){
  let edges=data.edges.slice();let nodes=data.nodes.slice();
  if(nwGraphFilter==='character')edges=edges.filter(e=>data.nodeMap.get(e.s)?.kind==='角色'||data.nodeMap.get(e.t)?.kind==='角色');
  else if(nwGraphFilter==='organization')edges=edges.filter(e=>data.nodeMap.get(e.s)?.kind==='组织'||data.nodeMap.get(e.t)?.kind==='组织');
  else if(nwGraphFilter==='item')edges=edges.filter(e=>data.nodeMap.get(e.s)?.kind==='道具'||data.nodeMap.get(e.t)?.kind==='道具');
  else if(nwGraphFilter==='place')edges=edges.filter(e=>data.nodeMap.get(e.s)?.kind==='地点'||data.nodeMap.get(e.t)?.kind==='地点');
  else if(['emotion','hostile','bond'].includes(nwGraphFilter))edges=edges.filter(e=>e.tone===nwGraphFilter);
  if(nwGraphFocus&&data.nodeMap.has(nwGraphFocus))edges=edges.filter(e=>e.s===nwGraphFocus||e.t===nwGraphFocus);
  const ids=new Set(edges.flatMap(e=>[e.s,e.t]));
  if(nwGraphFocus)ids.add(nwGraphFocus);
  if(nwGraphFilter==='all'&&!nwGraphFocus)nodes=data.nodes;
  else if(['character','organization','item','place'].includes(nwGraphFilter)&&!edges.length){
    const kind={character:'角色',organization:'组织',item:'道具',place:'地点'}[nwGraphFilter];nodes=data.nodes.filter(n=>n.kind===kind);
  }else nodes=data.nodes.filter(n=>ids.has(n.id));
  return{nodes,edges};
}
function nwEnsureGraphLayout(nodes,edges){
  const W=1200,H=760;
  const focus=nwGraphFocus&&nodes.find(n=>n.id===nwGraphFocus);
  if(focus){graphPositions[focus.id]={x:600,y:370};const others=nodes.filter(n=>n.id!==focus.id);others.forEach((n,i)=>{if(!graphPositions[n.id]||graphPositions[n.id].x===600){const a=(Math.PI*2*i/Math.max(others.length,1))-Math.PI/2;const ring=others.length>10?(i%2?285:210):255;graphPositions[n.id]={x:600+ring*Math.cos(a),y:370+ring*.72*Math.sin(a)};}});return;}
  const groups={角色:[],组织:[],道具:[],地点:[],关联对象:[]};nodes.forEach(n=>(groups[n.kind]||groups.关联对象).push(n));
  const centers={角色:[330,310],组织:[870,285],道具:[835,590],地点:[350,590],关联对象:[600,390]};
  Object.entries(groups).forEach(([kind,arr])=>{const [cx,cy]=centers[kind];arr.forEach((n,i)=>{if(graphPositions[n.id])return;const a=(Math.PI*2*i/Math.max(arr.length,1))-Math.PI/2;const ring=arr.length<=1?0:Math.min(190,75+arr.length*11);graphPositions[n.id]={x:nwClamp(cx+ring*Math.cos(a),75,W-75),y:nwClamp(cy+ring*.68*Math.sin(a),70,H-70)};});});
}
function nwGraphFocusCard(data,subset){
  const node=data.nodeMap.get(nwGraphFocus);if(!node)return'';
  const links=data.edges.filter(e=>e.s===node.id||e.t===node.id);
  return`<section class="nw-focus-card"><div class="nw-focus-avatar ${nwKindClass(node.kind)}">${node.image?`<img src="${node.image}" alt="">`:nwKindIcon(node.kind)}</div><div class="nw-focus-copy"><small>${esc(node.kind)}中心关系</small><h3>${esc(node.label)}</h3><p>${links.length?`直接关联 ${links.length} 条 · 当前显示 ${subset.edges.length} 条`:'暂时没有直接关系'}</p></div>${node.module&&node.itemId?`<button class="nw-open-btn" data-item="${esc(node.itemId)}" data-module="${esc(node.module)}">打开档案</button>`:''}</section>`;
}
function renderGraph(){
  const data=nwGraphData();const subset=nwGraphSubset(data);const {nodes,edges}=subset;const W=1200,H=760;nwEnsureGraphLayout(nodes,edges);
  const filters=[['all','全部'],['character','角色'],['organization','组织'],['item','道具'],['place','地点'],['emotion','感情'],['hostile','敌对'],['bond','羁绊']];
  const options=data.nodes.slice().sort((a,b)=>a.kind.localeCompare(b.kind,'zh-CN')||a.label.localeCompare(b.label,'zh-CN'));
  return`<div class="page nw-graph-page"><div class="page-title"><button class="back-btn" data-route="visual">‹</button><div><h1>⌬ 关系网络</h1><p>${data.nodes.length} 个对象 · ${data.edges.length} 条关联，可筛选或聚焦任一对象</p></div><button class="tiny-btn" data-open-module="relationships">编辑关系</button></div>
  <section class="nw-graph-control"><div class="nw-chip-scroll">${filters.map(([k,t])=>`<button class="nw-filter-chip ${nwGraphFilter===k?'active':''}" data-nw-graph-filter="${k}">${t}</button>`).join('')}</div><div class="nw-focus-row"><label>聚焦</label><select id="nwGraphFocus"><option value="">查看全部对象</option>${options.map(n=>`<option value="${esc(n.id)}" ${nwGraphFocus===n.id?'selected':''}>${esc(n.kind)} · ${esc(n.label)}</option>`).join('')}</select><button class="nw-layout-btn" data-action="graph-reset">自动排布</button></div></section>
  ${nwGraphFocusCard(data,subset)}

    const move=ev=>{if(Math.abs(ev.clientX-startX)+Math.abs(ev.clientY-startY)>7)moved=true;const r=canvas.getBoundingClientRect();const x=nwClamp((ev.clientX-r.left)/r.width*1200,60,1140);const y=nwClamp((ev.clientY-r.top)/r.height*760,60,700);node.style.left=(x/12)+'%';node.style.top=(y/7.6)+'%';graphPositions[id]={x,y};const svg=$('.nw-graph-svg',canvas);if(svg)svg.style.opacity='.45';};

function nwNumericTime(v,fallback){

function nwTimelineData(mode,items){

    nwArray(p.modules.organizations).filter(x=>x.founding||x.riseFall).forEach(x=>push('组织兴衰','organizations',x,x.founding,x.title,nwFirstText(x.riseFall,x.summary,x.goal),'organization'));

  }else if(mode==='characterJourney'){

function nwTimelineBoard(events){
  if(!events.length)return`<div class="card empty"><div class="empty-icon">⌁</div><h3>当前筛选没有事件</h3><p>切换“全部”，或新建一条带日期或排序数字的记录。</p></div>`;
  const sorted=events.slice().sort((a,b)=>a.pos-b.pos||a.lane.localeCompare(b.lane,'zh-CN'));
  const slots=[];sorted.forEach(e=>{const key=String(e.pos);if(!slots.some(s=>s.key===key))slots.push({key,pos:e.pos,label:e.time||`阶段 ${slots.length+1}`});});
  const slotIndex=new Map(slots.map((s,i)=>[s.key,i]));const laneMap=new Map();sorted.forEach(e=>{if(!laneMap.has(e.lane))laneMap.set(e.lane,[]);laneMap.get(e.lane).push(e);});
  const width=Math.max(760,170*slots.length+160);
  const lanes=[...laneMap.entries()].map(([lane,arr])=>{
    const collisions=new Map();const bars=arr.map(e=>{const idx=slotIndex.get(String(e.pos))||0;const c=collisions.get(idx)||0;collisions.set(idx,c+1);return{...e,idx,stack:c};});
    const maxStack=Math.max(1,...collisions.values());const height=Math.max(76,28+maxStack*54);
    return`<div class="nw-lane" style="height:${height}px"><div class="nw-lane-label"><b>${esc(lane)}</b><small>${arr.length} 条</small></div><div class="nw-lane-track">${bars.map(e=>`<button class="nw-time-bar ${e.kind}" style="left:${145+e.idx*170}px;top:${12+e.stack*54}px" data-item="${esc(e.item.id)}" data-module="${esc(e.module)}"><small>${esc(e.time||`顺序 ${e.pos}`)}</small><b>${esc(e.label)}</b><span>${esc(e.desc)}</span></button>`).join('')}</div></div>`;
  }).join('');
  return`<div class="nw-timeline-scroll"><div class="nw-timeline-board" style="width:${width}px"><div class="nw-axis"><div class="nw-axis-label">时间</div>${slots.map((s,i)=>`<div class="nw-tick" style="left:${145+i*170}px"><i></i><span>${esc(s.label)}</span></div>`).join('')}</div>${lanes}</div></div>`;
}

}

function nwMapPickerRows(choices,selected){return choices.length?`<section class="picker-group"><h4>△ 地理与环境<small>${choices.length}</small></h4>${choices.map(x=>`<button type="button" class="picker-row ${selected===x.token?'selected':''}" data-map-ref-choice="${esc(x.token)}"><span>${x.item.image?`<img src="${x.item.image}" alt="">`:'△'}</span><div><b>${esc(x.item.title||'未命名')}</b><small>${esc(x.item.type||x.item.parent||'地理档案')}</small></div><i>${selected===x.token?'✓':'＋'}</i></button>`).join('')}</section>`:'<div class="picker-empty">还没有地理档案。关闭后点击“新建地理档案并关联”。</div>';}
function nwCreateGeographyFromMap(){
  const it=nwSelectedMapItem();if(!it)return;const typeMap={city:'城市',village:'村镇',castle:'城市',mountain:'山脉',forest:'地区',water:'河流',ruin:'遗迹',portal:'特殊空间',label:'其他'};const title=prompt('地理档案名称',it.label||'未命名地点');if(!title)return;
  const rec={id:uid(),title,type:typeMap[it.type]||'其他',summary:`来自地图“${currentMap().name}”的${typeMap[it.type]||'地点'}标记`,coordinates:`地图坐标 ${it.x}%, ${it.y}%`,_refs:{},_related:[],tags:['地图标记'],createdAt:nowISO(),updatedAt:nowISO()};activeProject().modules.geography.unshift(rec);it.ref=nwToken('geography',rec.id);it.label=title;save();render();toast('地理档案已创建并关联');
}
handleAction=function(a,e){
  if(a==='map-link-archive'){nwOpenMapArchivePicker();return;}
  if(a==='map-unlink-archive'){const it=nwSelectedMapItem();if(it){it.ref='';save();render();toast('已解除地图关联');}return;}
  if(a==='map-create-archive'){nwCreateGeographyFromMap();return;}
  if(a==='map-edit-label'){const it=nwSelectedMapItem();if(it){const v=prompt('地图元素名称',it.label||'');if(v!==null){it.label=v.trim();save();render();}}return;}
  nwMapBaseHandleAction(a,e);
};
bindInteractions=function(root=document){
  nwMapBaseBindInteractions(root);root.querySelectorAll('[data-linked-map]').forEach(b=>b.onclick=()=>{selectedMapId=b.dataset.linkedMap;selectedMapItem=b.dataset.mapItem;route='map';render();});
};
nwRenderLinkSection=function(item){
  const base=nwMapBaseRenderLinkSection(item);if(currentModule!=='geography')return base;const token=nwToken('geography',item.id),places=[];activeProject().maps.forEach(map=>map.items.filter(x=>x.ref===token).forEach(marker=>places.push({map,marker})));
  if(!places.length)return base;return base+`<section class="card detail-section linked-section"><h3>地图位置</h3><div class="linked-list">${places.map(x=>`<button data-linked-map="${esc(x.map.id)}" data-map-item="${esc(x.marker.id)}"><i>⌖</i><span><strong>${esc(x.marker.label||item.title)}</strong><small>${esc(x.map.name)} · 坐标 ${esc(x.marker.x)}%, ${esc(x.marker.y)}%</small></span><em>›</em></button>`).join('')}</div></section>`;
};
(function(){const s=document.createElement('style');s.textContent=`.map-link-panel{margin-top:12px}.map-link-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.map-link-head small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.map-link-panel>p{color:var(--muted);font-size:12px;line-height:1.7}.map-link-actions{display:flex;gap:8px;margin-top:10px}.map-link-actions button{flex:1}.map-linked-dot{position:absolute;right:-5px;top:-7px;width:17px;height:17px;border-radius:50%;background:var(--violet);color:white;display:grid;place-items:center;font-size:9px;font-style:normal;box-shadow:0 4px 10px rgba(60,50,130,.25)}`;document.head.appendChild(s);})();
setTimeout(()=>render(),0);

</script>
</body>
</html>
