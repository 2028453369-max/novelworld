name: Deploy NovelWorld to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore complete site package
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          python3 - <<'PY'
          import base64
          import io
          import pathlib
          import shutil
          import zipfile

          payload = pathlib.Path('payload')
          candidates = [
              ['part_00.b64', 'part_01.b64', 'part_02_03.b64', 'part_04_05.b64', 'part_06_07.b64', 'part_08_09.b64'],
              ['part_00.b64', 'part_01.b64', 'part_02_03.b64', 'part_04_05.b64'],
          ]
          required = {'index.html', 'app.js', 'styles.css'}
          output = pathlib.Path('_site')
          errors = []

          for names in candidates:
              existing = [name for name in names if (payload / name).exists()]
              if len(existing) != len(names):
                  errors.append(f"missing files for candidate: {names}")
                  continue
              encoded = ''.join((payload / name).read_text(encoding='utf-8') for name in names)
              encoded = ''.join(encoded.split())
              try:
                  raw = base64.b64decode(encoded, validate=True)
                  with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                      members = set(archive.namelist())
                      if not required.issubset(members):
                          raise RuntimeError(f"required files missing; first entries: {sorted(members)[:12]}")
                      bad = archive.testzip()
                      if bad:
                          raise RuntimeError(f"corrupt member: {bad}")
                      shutil.rmtree(output, ignore_errors=True)
                      output.mkdir(parents=True, exist_ok=True)
                      archive.extractall(output)
                  print(f"Restored with: {', '.join(names)}")
                  print(f"Decoded ZIP bytes: {len(raw)}")
                  break
              except Exception as exc:
                  errors.append(f"{names}: {exc}")
          else:
              raise SystemExit('No valid package candidate. ' + ' | '.join(errors))
          PY
          test -f _site/index.html
          test -f _site/app.js
          test -f _site/styles.css
          rm -f _site/_headers
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  report:
    if: always()
    runs-on: ubuntu-latest
    needs: [build, deploy]
    steps:
      - name: Report deployment result
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        shell: bash
        run: |
          if [ "$BUILD_RESULT" = "success" ] && [ "$DEPLOY_RESULT" = "success" ]; then
            TITLE="NOVELWORLD_DEPLOYMENT_OK"
          else
            TITLE="NOVELWORLD_DEPLOYMENT_FAILED_FINAL"
          fi
          BODY=$(printf 'Build: %s\nDeploy: %s\nURL: https://2028453369-max.github.io/novelworld/\nCommit: %s\n' "$BUILD_RESULT" "$DEPLOY_RESULT" "$GITHUB_SHA")
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
