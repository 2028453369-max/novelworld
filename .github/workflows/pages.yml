name: Deploy NovelWorld to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore complete site package
        id: restore
        shell: bash
        run: |
          rm -rf _site site.b64 site.zip
          mkdir -p _site
          cat \
            payload/part_00.b64 \
            payload/part_01.b64 \
            payload/part_02_03.b64 \
            payload/part_04_05.b64 \
            | tr -d '\r\n\t ' > site.b64

          B64_BYTES=$(wc -c < site.b64 | tr -d ' ')
          echo "b64_bytes=$B64_BYTES" >> "$GITHUB_OUTPUT"
          test "$B64_BYTES" = "75092"

          base64 --decode site.b64 > site.zip
          ZIP_SHA=$(sha256sum site.zip | cut -d' ' -f1)
          echo "zip_sha=$ZIP_SHA" >> "$GITHUB_OUTPUT"
          test "$ZIP_SHA" = "30b4bfb047f0f42f4bbba385942d233b314d7b8bab4e100220181d3df76754df"

          unzip -q site.zip -d _site
          test -f _site/index.html
          test -f _site/app.js
          test -f _site/styles.css
          rm -f _site/_headers
          touch _site/.nojekyll

      - name: Configure Pages
        id: configure
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report successful deployment
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: gh issue create --title "NOVELWORLD_DEPLOYMENT_OK" --body "Deployment completed successfully. URL: $PAGE_URL"

  report-failure:
    if: failure()
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Report failure
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: gh issue create --repo "${{ github.repository }}" --title "NOVELWORLD_DEPLOYMENT_FAILED_AFTER_FIX" --body "Build result: $BUILD_RESULT; Deploy result: $DEPLOY_RESULT"
