name: Deploy NovelWorld to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild complete app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public
          cat payload/part_00.b64 payload/part_01.b64 payload/part_02_03.b64 payload/part_04_05.b64 > novelworld.b64
          base64 --decode novelworld.b64 > novelworld.zip
          unzip -q novelworld.zip -d public
          touch public/.nojekyll
          test -f public/index.html
          test -f public/app.js
          test -f public/styles.css

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          if [ "$DEPLOY_OUTCOME" = "success" ]; then
            gh issue create --title "NOVELWORLD_DEPLOYMENT_OK" --body "Deployment completed successfully. URL: $PAGE_URL"
          else
            gh issue create --title "NOVELWORLD_DEPLOYMENT_FAILED" --body "Deployment did not complete successfully. Check the latest Actions run."
            exit 1
          fi
