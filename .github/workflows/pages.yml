name: Publish NovelWorld Mobile App

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: "novelworld-publish"
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Restore complete app
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site site.b64 site.zip
          mkdir -p _site
          cat \
            payload/part_00.b64 \
            payload/part_01.b64 \
            payload/part_02_03.b64 \
            payload/part_04_05.b64 \
            payload/part_06_07.b64 \
            payload/part_08_09.b64 \
            | tr -d '\r\n\t ' > site.b64
          base64 --decode site.b64 > site.zip
          unzip -tq site.zip
          unzip -q site.zip -d _site
          test -f _site/index.html
          test -f _site/app.js
          test -f _site/styles.css
          rm -f _site/_headers
          touch _site/.nojekyll

      - name: Publish files to public branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd _site
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b published
          git add -A
          git commit -m "Publish NovelWorld mobile app"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin published

      - name: Report published URL
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          URL="https://raw.githack.com/${GITHUB_REPOSITORY}/published/index.html"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "NOVELWORLD_PUBLISHED_OK" --body "URL: $URL"
