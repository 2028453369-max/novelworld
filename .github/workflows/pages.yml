name: Deploy NovelWorld to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore site package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cat \
            payload/part_00.b64 \
            payload/part_01.b64 \
            payload/part_02_03.b64 \
            payload/part_04_05.b64 \
            payload/part_06_07.b64 \
            payload/part_08_09.b64 \
            | base64 --decode > site.zip
          unzip -q site.zip -d _site
          test -f _site/index.html
          test -f _site/app.js
          test -f _site/styles.css
          rm -f _site/_headers
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
