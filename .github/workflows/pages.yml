name: Deploy NovelWorld to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore complete site package
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site site.b64 site.zip
          mkdir -p _site
          cat \
            payload/part_00.b64 \
            payload/part_01.b64 \
            payload/part_02_03.b64 \
            payload/part_04_05.b64 \
            payload/part_06_07.b64 \
            payload/part_08_09.b64 \
            | tr -d '\r\n\t ' > site.b64

          B64_BYTES=$(wc -c < site.b64 | tr -d ' ')
          echo "Base64 bytes: $B64_BYTES"
          test "$B64_BYTES" = "75092"

          base64 --decode site.b64 > site.zip
          ZIP_SHA=$(sha256sum site.zip | cut -d' ' -f1)
          echo "ZIP SHA256: $ZIP_SHA"
          test "$ZIP_SHA" = "30b4bfb047f0f42f4bbba385942d233b314d7b8bab4e100220181d3df76754df"

          unzip -q site.zip -d _site
          test -f _site/index.html
          test -f _site/app.js
          test -f _site/styles.css
          rm -f _site/_headers
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  report:
    if: always()
    runs-on: ubuntu-latest
    needs: [build, deploy]
    steps:
      - name: Report deployment result
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        shell: bash
        run: |
          if [ "$BUILD_RESULT" = "success" ] && [ "$DEPLOY_RESULT" = "success" ]; then
            TITLE="NOVELWORLD_DEPLOYMENT_OK"
          else
            TITLE="NOVELWORLD_DEPLOYMENT_FAILED"
          fi
          BODY=$(printf 'Build: %s\nDeploy: %s\nURL: https://2028453369-max.github.io/novelworld/\nCommit: %s\n' "$BUILD_RESULT" "$DEPLOY_RESULT" "$GITHUB_SHA")
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
