name: Deploy NovelWorld to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore complete site package
        id: restore
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site site.b64 site.zip
          mkdir -p _site
          cat \
            payload/part_00.b64 \
            payload/part_01.b64 \
            payload/part_02_03.b64 \
            payload/part_04_05.b64 \
            payload/part_06_07.b64 \
            payload/part_08_09.b64 \
            | tr -d '\r\n\t ' > site.b64
          echo "Base64 length: $(wc -c < site.b64)"
          base64 --decode site.b64 > site.zip
          echo "ZIP SHA256: $(sha256sum site.zip)"
          unzip -t site.zip
          unzip -q site.zip -d _site
          test -f _site/index.html
          test -f _site/app.js
          test -f _site/styles.css
          rm -f _site/_headers
          touch _site/.nojekyll

      - name: Configure Pages
        id: configure
        if: steps.restore.outcome == 'success'
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        id: upload
        if: steps.restore.outcome == 'success' && steps.configure.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Diagnose build
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESTORE_RESULT: ${{ steps.restore.outcome }}
          CONFIGURE_RESULT: ${{ steps.configure.outcome }}
          UPLOAD_RESULT: ${{ steps.upload.outcome }}
        shell: bash
        run: |
          BODY=$(printf 'Restore: %s\nConfigure Pages: %s\nUpload: %s\nCommit: %s\n' "$RESTORE_RESULT" "$CONFIGURE_RESULT" "$UPLOAD_RESULT" "$GITHUB_SHA")
          if [ "$RESTORE_RESULT" != "success" ] || [ "$CONFIGURE_RESULT" != "success" ] || [ "$UPLOAD_RESULT" != "success" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "NOVELWORLD_BUILD_DIAGNOSIS" --body "$BODY"
            exit 1
          fi

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report success
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "NOVELWORLD_DEPLOYMENT_OK" --body "URL: $PAGE_URL"
